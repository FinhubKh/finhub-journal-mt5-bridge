services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host worker on Windows uses 127.0.0.1:6379 — do not publish to 0.0.0.0 in production
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--save",
        "",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
        "--tcp-backlog",
        "511",
        "--bind",
        "0.0.0.0",
        "--protected-mode",
        "yes",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside Compose, Redis is the service name (overrides host .env localhost)
      REDIS_URL: redis://redis:6379/0
      BRIDGE_API_HOST: 0.0.0.0
      BRIDGE_API_PORT: "8788"
    ports:
      - "8788:8788"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  redis_data:
